<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Espace client — Angel Coaching</title><meta name="robots" content="noindex"><link rel="stylesheet" href="style.css"></head><body>
<header><b><a href="index.html" style="text-decoration:none;color:inherit">Angel Coaching</a></b><nav><button class="btn alt" id="logout" hidden>Déconnexion</button></nav></header>
<main class="wrap"><section>
<div id="msg" class="msg" hidden></div>
<div id="auth" class="card" style="max-width:420px;margin:auto"><h2>Connexion</h2>
<label>E-mail<input id="email" type="email" autocomplete="email"></label>
<label>Mot de passe (8 caractères min.)<input id="pwd" type="password" autocomplete="current-password"></label>
<button class="btn" id="login">Se connecter</button> <button class="btn alt" id="signup">Créer un compte</button>
<p><a href="#" id="forgot" class="mut">Mot de passe oublié ?</a></p></div>
<div id="recov" class="card" style="max-width:420px;margin:auto" hidden><h2>Nouveau mot de passe</h2>
<label>Nouveau mot de passe<input id="newpwd" type="password" autocomplete="new-password"></label><button class="btn" id="newbtn">Enregistrer</button></div>
<div id="sign" class="card" style="max-width:560px;margin:auto" hidden><h2>Contrat de confiance et de confidentialité</h2>
<p>Avant d'accéder à votre espace, merci de lire puis signer le <a href="contrat.html" target="_blank">contrat</a>.</p>
<label><input type="checkbox" id="signok">J'ai lu et j'accepte le contrat</label><br><br>
<label><input type="checkbox" id="signrep">Je signe en tant que représentant légal d'un mineur</label>
<label>Nom complet (vaut signature)<input id="signnom" autocomplete="name"></label><button class="btn" id="signbtn">Signer</button></div>
<div id="app" hidden>
<div class="tabs" id="tabs"><button data-t="fiche">Ma fiche</button><button data-t="objectifs">Mes objectifs</button><button data-t="actions">Mes actions</button><button data-t="diete">Mon alimentation</button><button data-t="docs">Mes documents</button><button data-t="contrat">Mon contrat</button></div>
<div class="tab" id="t-fiche"></div><div class="tab" id="t-objectifs"></div><div class="tab" id="t-actions"></div><div class="tab" id="t-diete"></div><div class="tab" id="t-docs"></div><div class="tab" id="t-contrat"></div>
</div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="silhouette.js"></script>
<script src="config.js"></script>
<script>
const CV="v1";let recovery=location.hash.includes("type=recovery"),U,P={},I=[],S=[],D=[],K;
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const say=t=>{$("msg").textContent=t;$("msg").hidden=!t};
if(String(SUPABASE_URL).includes("VOTRE"))say("config.js n'est pas encore renseigné (URL et clé Supabase).");
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const F=[["prenom","Prénom","text"],["nom","Nom","text"],["sexe","Sexe","select"],["telephone","Téléphone","tel"],["naissance","Date de naissance","date"],["taille_cm","Taille (cm)","number"],["poids_depart","Poids de départ (kg)","number"],["poids_objectif","Poids visé (kg)","number"]];
const body=(f,st)=>{const c=100,a=x=>x*f;return `<g ${st}><circle cx="100" cy="36" r="21"/><path d="M${c-a(42)} 88Q100 74 ${c+a(42)} 88L${c+a(35)} 198Q${c+a(46)} 224 ${c+a(44)} 236H${c-a(44)}Q${c-a(46)} 224 ${c-a(35)} 198Z"/><rect x="${c-a(60)}" y="92" width="${a(15)}" height="124" rx="8"/><rect x="${c+a(45)}" y="92" width="${a(15)}" height="124" rx="8"/><rect x="${c-a(44)}" y="232" width="${a(41)}" height="172" rx="14"/><rect x="${c+a(3)}" y="232" width="${a(41)}" height="172" rx="14"/></g>`};
const chk=i=>`<label class="row"><input type="checkbox" data-id="${i.id}" ${i.fait?"checked":""}><span>${esc(i.titre)}</span>${i.type==="etape"?`<b>${i.points} pts</b>`:""}</label>`;
const docs=(cat,vide)=>{const L=D.filter(d=>d.categorie===cat);return L.length?`<div class="grid">${L.map(d=>`<div class="card"><b>${esc(d.titre)}</b><p class="mut">${new Date(d.created_at).toLocaleDateString("fr-FR")}</p><button class="btn dl" data-path="${esc(d.file_path)}">Télécharger</button></div>`).join("")}</div>`:`<p class="mut">${vide}</p>`};
function tab(t){document.querySelectorAll(".tab").forEach(x=>x.hidden=x.id!=="t-"+t);document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t))}
function draw(){
 $("t-fiche").innerHTML=`<h2>Ma fiche de départ</h2><p class="mut">À remplir une fois : c'est le point de départ de votre suivi.</p><div class="card"><div class="two">${F.map(([k,l,t])=>t==="select"?`<label>${l}<select id="f_${k}"><option value="">—</option><option value="homme" ${P[k]==="homme"?"selected":""}>Homme</option><option value="femme" ${P[k]==="femme"?"selected":""}>Femme</option></select></label>`:`<label>${l}<input id="f_${k}" type="${t}" ${t==="number"?'step="0.1"':""} value="${esc(P[k])}"></label>`).join("")}</div><label>Informations utiles (santé, allergies, contraintes…)<textarea id="f_notes" rows="3">${esc(P.notes)}</textarea></label><button class="btn" id="savef">Enregistrer</button></div>`;
 const w0=+P.poids_depart||0,wt=+P.poids_objectif||0,W=S.filter(x=>x.poids!=null),last=W.length?+W[W.length-1].poids:w0;
 const wp=w0&&wt&&w0!==wt?Math.max(0,Math.min(1,(last-w0)/(wt-w0)))*100:0;
 const E=I.filter(i=>i.type==="etape"),tot=E.reduce((a,i)=>a+i.points,0),dn=E.filter(i=>i.fait).reduce((a,i)=>a+i.points,0),sp=tot?dn/tot*100:0;
 const f=w0?Math.max(.65,Math.min(1.4,1+(last/w0-1)*2.2)):1;
 $("t-objectifs").innerHTML=`<h2>Mes objectifs</h2>${w0?"":'<p class="msg">Renseignez d\'abord votre fiche de départ (onglet « Ma fiche »).</p>'}<div class="two"><div class="card" style="text-align:center"><div id="sil"></div></div></div>
 <h3 style="margin-top:26px">Ma pesée</h3><div class="card"><div class="two"><label>Date<input id="pd" type="date" value="${new Date().toISOString().slice(0,10)}"></label><label>Poids (kg)<input id="pp" type="number" step="0.1"></label></div><label>Note / ressenti<textarea id="pn" rows="2"></textarea></label><button class="btn" id="padd">Enregistrer</button></div>
 <table style="margin-top:16px"><thead><tr><th>Date</th><th>Poids</th><th>Note</th></tr></thead><tbody>${[...S].reverse().map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(r.poids)}</td><td>${esc(r.note)}</td></tr>`).join("")||'<tr><td colspan="3" class="mut">Aucune pesée.</td></tr>'}</tbody></table>`;
 try{Silhouette.mount($("sil"),{h:+P.taille_cm||175,w0:w0||70,w:last||w0||70,sexe:P.sexe,naissance:P.naissance})}catch(e){}
 const A=I.filter(i=>i.type==="action");
 $("t-actions").innerHTML=`<h2>Mes actions</h2>${A.length?A.map(chk).join(""):'<p class="mut">Aucune action pour le moment.</p>'}`;
 $("t-diete").innerHTML=`<h2>Mon alimentation</h2>${docs("diete","Vos conseils alimentaires apparaîtront ici.")}`;
 $("t-docs").innerHTML=`<h2>Mes documents</h2>${docs("programme","Aucun document pour le moment.")}`;
 $("t-contrat").innerHTML=`<h2>Mon contrat</h2><div class="card">${K?`Contrat de confiance et de confidentialité signé le <b>${new Date(K.signe_le).toLocaleDateString("fr-FR")}</b> par <b>${esc(K.nom_signataire)}</b>.`:"Contrat non signé."}<p><a href="contrat.html" target="_blank">Relire le contrat</a></p></div>`;
}
async function loadAll(){const q=t=>sb.from(t).select("*").eq("user_id",U.id);
 const [a,b,c,d,e]=await Promise.all([q("profils").maybeSingle(),q("items").order("created_at"),q("suivis").order("date"),q("programmes").order("created_at",{ascending:false}),q("contrats_signes").eq("version",CV).limit(1)]);
 P=a.data||{};I=b.data||[];S=c.data||[];D=d.data||[];K=(e.data||[])[0]}
async function render(session){
 $("auth").hidden=!!session;$("logout").hidden=!session;$("app").hidden=true;$("sign").hidden=true;$("recov").hidden=true;
 if(!session)return;U=session.user;
 if(recovery){$("auth").hidden=true;$("recov").hidden=false;return}
 const {data:c}=await sb.from("contrats_signes").select("id").eq("version",CV).limit(1);
 if(!c||!c.length){$("sign").hidden=false;return}
 await sb.from("profils").upsert({user_id:U.id,email:U.email},{onConflict:"user_id",ignoreDuplicates:true});
 await loadAll();draw();$("app").hidden=false;tab(P.poids_depart?"objectifs":"fiche")}
const run=async fn=>{try{await fn()}catch(e){say("Connexion à la base impossible (projet Supabase en pause ou config.js incorrect) : "+e.message)}};
$("login").onclick=()=>run(async()=>{const {error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("pwd").value});say(error?(/confirm/i.test(error.message)?"Confirmez d'abord votre e-mail (lien reçu à l'inscription).":"Identifiants incorrects."):"")});
$("signup").onclick=()=>run(async()=>{const email=$("email").value.trim(),pw=$("pwd").value;
 if(!email||pw.length<8)return say("Indiquez un e-mail valide et un mot de passe de 8 caractères minimum.");
 const {data,error}=await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:location.origin+location.pathname}});
 if(error)return say("Inscription impossible : "+error.message);
 say(data.session?"":"Compte créé : un e-mail de confirmation vient d'être envoyé (pensez à vérifier les spams).")});
$("forgot").onclick=e=>{e.preventDefault();run(async()=>{if(!$("email").value)return say("Saisissez votre e-mail ci-dessus.");
 await sb.auth.resetPasswordForEmail($("email").value.trim(),{redirectTo:location.origin+location.pathname});say("Si le compte existe, un e-mail vient d'être envoyé.")})};
$("logout").onclick=()=>sb.auth.signOut();
$("newbtn").onclick=()=>run(async()=>{if($("newpwd").value.length<8)return say("8 caractères minimum.");
 const {error}=await sb.auth.updateUser({password:$("newpwd").value});if(error)return say(error.message);
 recovery=false;history.replaceState(null,"",location.pathname);say("Mot de passe mis à jour.");render((await sb.auth.getSession()).data.session)});
$("signbtn").onclick=()=>run(async()=>{const nom=$("signnom").value.trim();
 if(nom.length<3||!$("signok").checked)return say("Cochez la case et indiquez votre nom complet.");
 const {error}=await sb.from("contrats_signes").insert({user_id:U.id,version:CV,nom_signataire:nom,representant_legal:$("signrep").checked});
 if(error)return say(error.message);say("");render((await sb.auth.getSession()).data.session)});
$("tabs").onclick=e=>{const b=e.target.closest("button");if(b)tab(b.dataset.t)};
$("app").onclick=e=>run(async()=>{const t=e.target;
 if(t.classList.contains("dl")){const {data,error}=await sb.storage.from("programmes").createSignedUrl(t.dataset.path,60);return error?say(error.message):window.open(data.signedUrl,"_blank")}
 if(t.id==="savef"){const v={};F.forEach(([k,,ty])=>{const x=$("f_"+k).value;v[k]=x===""?null:ty==="number"?+x:x});v.notes=$("f_notes").value||null;
  const {error}=await sb.from("profils").update(v).eq("user_id",U.id);if(error)return say(error.message);say("");await loadAll();draw();tab("objectifs")}
 if(t.id==="padd"){if(!$("pp").value)return say("Indiquez votre poids.");
  const {error}=await sb.from("suivis").insert({user_id:U.id,date:$("pd").value,poids:+$("pp").value,note:$("pn").value||null});if(error)return say(error.message);say("");await loadAll();draw();tab("objectifs")}});
$("app").onchange=e=>run(async()=>{const id=e.target.dataset.id;if(!id)return;
 const {error}=await sb.from("items").update({fait:e.target.checked,fait_le:e.target.checked?new Date().toISOString():null}).eq("id",id);
 if(error)return say(error.message);const t=document.querySelector(".tab:not([hidden])").id.slice(2);await loadAll();draw();tab(t)});
sb.auth.onAuthStateChange((e,s)=>{if(e==="PASSWORD_RECOVERY")recovery=true;run(()=>render(s))});run(async()=>render((await sb.auth.getSession()).data.session));
</script></body></html>
